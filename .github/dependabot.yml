# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  # GitHub Actions — keeps all `uses:` pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # Go modules
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Dev tools pinned with `tool` directives in tools/go.mod. One grouped PR
  # a week; CI exercises every tool, so a green run means the bump is safe.
  - package-ecosystem: gomod
    directory: /tools
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, tools]
    groups:
      dev-tools:
        patterns: ["*"]

  # Docker base images (tags and digests) in ci/Dockerfile
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
