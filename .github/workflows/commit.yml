name: "Commit"

# PRs (including Dependabot's) and main. Pushes to other branches are
# covered once they have a PR; run manually from the Actions tab otherwise.
# deploy.yml starts after this workflow succeeds on main (workflow_run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes its in-flight run; main runs always finish.
  group: commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Dev tools are pinned in tools/go.mod; see the Makefile.
  TOOL: go tool -modfile=tools/go.mod

jobs:
  compile-binary:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: "Compile every binary"
        run: make build

  build-image:
    runs-on: ubuntu-latest
    needs:
      - compile-binary
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Only main publishes; every other ref just proves the image builds.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Log in to GitHub Container Registry"
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Image metadata"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: "Build (and push on main)"
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: "Attest build provenance"
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: "Run Go tests (race detector + coverage)"
        run: make test-junit

      - name: "Coverage summary"
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          echo "### Test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload coverage profile"
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && hashFiles('junit-report.xml') != '' }}
        with:
          report_paths: 'junit-report.xml'

  integration:
    # Real Postgres/Valkey via testcontainers-go; ubuntu-latest ships Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: "Run integration tests (race detector + coverage)"
        run: make test-integration

      - name: "Coverage summary"
        if: ${{ !cancelled() && hashFiles('coverage-integration.out') != '' }}
        run: |
          total=$(go tool cover -func=coverage-integration.out | awk '/^total:/ {print $NF}')
          echo "### Integration test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload coverage profile"
        if: ${{ !cancelled() && hashFiles('coverage-integration.out') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.out

  complexity:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: tools/go.sum

      - name: "Run gocyclo"
        run: make complexity

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: "Cache golangci-lint analysis"
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}-

      - name: "go.mod / go.sum are tidy"
        run: make tidy-check

      - name: "Formatting (gofumpt + goimports)"
        run: $TOOL golangci-lint fmt --diff ./...

      - name: "go vet"
        run: make vet

      - name: "Run golangci-lint"
        run: make lint

      - name: "Lint workflows (actionlint)"
        run: make actionlint

  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: "Check dependency licenses"
        run: make licenses

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: "Run gosec"
        # Excluded rules and their rationale are documented in .golangci.yml.
        run: $TOOL gosec -exclude=G104,G304,G602,G703,G704 -fmt=junit-xml -out=gosec-report.xml -stdout ./...

      - name: "Publish Security Report"
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && hashFiles('gosec-report.xml') != '' }}
        with:
          report_paths: 'gosec-report.xml'

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: "Run govulncheck"
        run: make vuln

  release-config:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Validate .goreleaser.yaml"
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: 'go'

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
