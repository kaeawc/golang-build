name: "Fuzz"

# Nightly long-budget fuzzing. Each fuzz target gets its own job so they
# run in parallel and a failure names the target. PR CI already replays the
# seed corpus and testdata/fuzz as ordinary tests via `make test`.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzzing budget per target (Go duration, e.g. 30s, 10m)"
        required: false
        default: "5m"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: "Discover fuzz targets"
        id: list
        # Assign first: a failing command substitution inside echo would be
        # masked by echo's own success and leave the matrix empty.
        run: |
          targets=$(bash scripts/fuzz.sh -json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: "fuzz (${{ matrix.target.name }})"
    needs: list-targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-targets.outputs.targets) }}
    env:
      FUZZTIME: ${{ inputs.fuzztime || '5m' }}
      PKG: ${{ matrix.target.pkg }}
      TARGET: ${{ matrix.target.name }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: "Locate fuzz cache"
        run: echo "FUZZCACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"

      # The generated corpus lives in GOCACHE, not the repo. Carrying it
      # between nightly runs makes each run resume where the last stopped.
      - name: "Restore generated corpus"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FUZZCACHE }}
          key: fuzz-${{ matrix.target.pkg }}-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target.pkg }}-${{ matrix.target.name }}-

      - name: "Fuzz ${{ matrix.target.name }} for ${{ env.FUZZTIME }}"
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"

      # A failing input is written to <pkg>/testdata/fuzz/<target>/. Download
      # it, commit it next to the target, and fix the bug it reveals.
      - name: "Upload failing inputs"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ strategy.job-index }}-${{ matrix.target.name }}
          path: '**/testdata/fuzz/'
          if-no-files-found: warn
