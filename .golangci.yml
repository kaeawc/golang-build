run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam
    - gocyclo
    - bodyclose
    - noctx
    - nilerr
    - errorlint
    - gosec

linters-settings:
  gocyclo:
    min-complexity: 10
  govet:
    enable-all: true
  errorlint:
    errorf: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
