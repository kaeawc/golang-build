# golangci-lint v2 config. Run via `make lint` (pinned in tools/go.mod).
# Reference: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - noctx
    - staticcheck
    - unused
    - wastedassign
    # Security / complexity (also run standalone in CI as `gosec` / `gocyclo`)
    - gocyclo
    - gosec
    # Style / modern Go
    - copyloopvar
    - intrange
    - misspell
    - modernize
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errorlint:
      errorf: true
    gocyclo:
      min-complexity: 10
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gosec:
      excludes:
        - G104 # best-effort cleanup is intentional
        - G304 # path is caller input by design (vfs/fsutil/cacheutil)
        - G602 # false positive on UintN(256) → byte
        - G703 # same path-as-input rationale as G304
        - G704 # httpx URL is caller input by design
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: false
      no-global: ""
      context: ""
      key-naming-case: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - noctx
          - revive
          - unconvert
          - unparam
        path: _test\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kaeawc/golang-build
  exclusions:
    generated: lax
