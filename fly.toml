app = "golang-build"
primary_region = "iad"

[build]
  dockerfile = "ci/Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
