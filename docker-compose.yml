version: "3.9"
# Fixes the container names (golang-build-postgres-1, ...) that
# scripts/dev.sh waits on, whatever the checkout directory is called.
name: golang-build

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: ci/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://appuser:apppass@postgres:5432/appdb?sslmode=disable"
      VALKEY_ADDR: "valkey:6379"
      # Traces/metrics to the otel-lgtm service; remove to disable.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4318"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  # Grafana + Tempo + Prometheus + Loki with an OTLP endpoint, for viewing
  # the server's traces and metrics locally: http://localhost:3000.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
